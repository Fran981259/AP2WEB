# Render Blueprint — AP2WEB (plano free)
# Free tier do Render não suporta disco persistente — o SQLite vive dentro do
# container e é recriado a cada deploy. Para persistência real, use plano
# pago (descomente o bloco disk) ou um VPS.
services:
  - type: web
    name: ap2web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: AP2WEB_ORIGINS
        value: https://app.theprostatereview.com
      - key: AP2WEB_SECRET
        generateValue: true
    # Plano pago: persistência do banco entre deploys.
    # disk:
    #   name: ap2web-data
    #   mountPath: /data
    #   sizeGB: 1