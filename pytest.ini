[pytest]
# ── AP2WEB test configuration ─────────────────────────────────────────────────
# testpaths: only the `tests/` directory. Runner-style scripts under tests/
# (test_smoke_local.py, regression_suite.py) are excluded automatically because
# they have no `test_*` functions and are gated behind `__main__`.
# ───────────────────────────────────────────────────────────────────────────────
testpaths = tests

# ── Plugin policy ──────────────────────────────────────────────────────────────
# `pytest-rerunfailures` (v16.6) is NOT used by this suite, and when loaded it
# binds a localhost TCP socket (ServerStatusDB) to coordinate rerun state under
# xdist, which caused "socket-related failures" and incomplete runs. We disable
# ONLY that plugin. All other plugins (pytest-timeout, pytest-html, etc.) are
# allowed to autoload. This is intentionally NOT PYTEST_DISABLE_PLUGIN_AUTOLOAD.
addopts =
    -p no:rerunfailures
    -p no:seleniumbase

# ── Hang diagnostics (Step 2.3) ────────────────────────────────────────────────
# pytest-timeout with thread method: on timeout it dumps the stack of every
# thread (identifying the hanging test + call site), fails nonzero, and never
# silently passes. The suite normally finishes in <30s; 120s per test is a pure
# diagnostic ceiling, not a substitute for fixing deadlocks.
# Override locally with: pytest tests/ --timeout=0
timeout = 120
timeout_method = thread
