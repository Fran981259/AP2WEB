name: AP2WEB CI — build, lint, typecheck, tests, smoke, docker
on: [push, pull_request]
jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    env:
      AP2WEB_ENV: development
      AP2WEB_SECRET: ci-test-secret-not-for-production-0123456789abcdef
      AP2WEB_DB_PATH: /tmp/ap2web-ci.db
      AP2WEB_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      AP2WEB_ENFORCE_ROLES: "true"
      AP2WEB_ENABLE_WORKER: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create venv + install backend deps (incl. dev)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --upgrade pip
          backend/.venv/bin/pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Compile backend
        run: npm run compile

      - name: Ruff lint
        run: npm run lint

      - name: Mypy typecheck (hardened surface)
        run: npm run typecheck

      - name: ESLint (frontend src)
        run: npm run lint:frontend

      - name: Build frontend
        run: npm run build

      - name: Pytest suite (unit + security + jobs)
        run: npm run test:unit

      - name: Git diff cleanliness
        run: git diff --check

      - name: No committed secrets / key material
        run: |
          if grep -rE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv -l \
            "BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY|api[_-]?key[[:space:]]*[:=][[:space:]]*(sk|AKIA)[A-Za-z0-9]" .; then
            echo "Chaves/secrets encontrados no repositório (exceto placeholders de .env.example)"
            exit 1
          fi
          echo "Secret scan OK"

      - name: Runtime smoke (backend boot + /api/ready + smoke script)
        run: |
          backend/.venv/bin/uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          BPID=$!
          trap 'kill $BPID 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 40); do
            if curl -sSf http://127.0.0.1:8000/api/ready >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then echo "Backend não ficou pronto. Logs:"; cat backend.log; exit 1; fi
          curl -sSf http://127.0.0.1:8000/api/health >/dev/null
          curl -sSf http://127.0.0.1:8000/api/health/dependencies >/dev/null
          backend/.venv/bin/python tests/regression_suite.py --phase A
          FRONTEND_URL=skip backend/.venv/bin/python tests/test_smoke_local.py \
            && echo "smoke backend-only OK (frontend sobe em CI separada)"

  docker-build:
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (multistage Python+Node)
        run: docker build -t ap2web:ci .
