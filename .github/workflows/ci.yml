name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Backend tests and checks
        run: |
          python -m compileall backend/app
          ruff check backend/app
          mypy --follow-imports=skip backend/app/main.py backend/app/api/*.py backend/app/security backend/app/config.py backend/app/db backend/app/auth backend/app/jobs backend/app/ratelimit.py backend/app/worker.py
          python -m pytest tests/ -q
      - name: Frontend checks
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run build
      - name: Reject whitespace errors
        run: git diff --check
